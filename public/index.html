<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中日翻译学习工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── CSS 变量（亮色/暗色） ── */
:root {
  --bg: #f8f9fa;
  --surface: #ffffff;
  --surface2: #f3f4f6;
  --border: #e0e0e0;
  --border2: #f0f0f0;
  --text: #2c3e50;
  --text-muted: #666;
  --text-faint: #bbb;
  --nav-bg: #ffffff;
  --divider-bg: #e8e8e8;
  --sk1: #f0f0f0;
  --sk2: #e0e0e0;
  --accent: #4f46e5;
  --accent-bg: #eef2ff;
}
.dark {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222635;
  --border: #2d3148;
  --border2: #252840;
  --text: #e2e8f0;
  --text-muted: #8892a4;
  --text-faint: #444c60;
  --nav-bg: #13151f;
  --divider-bg: #2d3148;
  --sk1: #1e2235;
  --sk2: #262a3d;
  --accent: #7c75f2;
  --accent-bg: #1e1f3a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .2s, color .2s;
}

/* ── NAV ── */
nav {
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.3px;
  margin-right: 24px;
}

.tabs { display: flex; gap: 4px; flex: 1; }

.tab-btn {
  padding: 6px 16px;
  border: none;
  background: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-muted);
  transition: all .15s;
}
.tab-btn.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.tab-btn:hover:not(.active) { background: var(--surface2); }

.badge {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 10px;
  padding: 1px 6px;
  margin-left: 6px;
  vertical-align: middle;
  min-width: 20px;
  text-align: center;
}
.badge:empty { display: none; }

/* 模式切换 */
.mode-btns {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  margin-right: 16px;
}
.mode-btn {
  padding: 4px 14px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  transition: all .15s;
}
.mode-btn.active {
  background: var(--accent);
  color: #fff;
}

/* 暗色模式按钮 */
#dark-toggle {
  margin-left: auto;
  width: 36px;
  height: 36px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
#dark-toggle:hover { border-color: var(--accent); }

/* ── MAIN ── */
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

/* 风格切换 */
.style-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.style-label { font-size: 13px; color: var(--text-muted); }
.style-btn {
  padding: 5px 16px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
  transition: all .15s;
}
.style-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }

/* ── 翻译区 ── */
.translation-container {
  display: grid;
  grid-template-columns: 1fr 3px 1fr;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  min-height: 220px;
}

.pane { display: flex; flex-direction: column; position: relative; }

.pane-header {
  padding: 10px 16px 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.pane-header .lang-dot { width: 8px; height: 8px; border-radius: 50%; }
.pane:first-child .lang-dot { background: #e74c3c; }
.pane:last-child .lang-dot { background: #e84393; }

.pane textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 14px 16px;
  font-size: 16px;
  line-height: 1.7;
  font-family: inherit;
  color: var(--text);
  background: transparent;
  min-height: 160px;
}
.pane textarea::placeholder { color: var(--text-faint); }

.divider {
  background: var(--divider-bg);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.divider::after {
  content: '⇄';
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text-muted);
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

/* Skeleton */
.skeleton-overlay {
  position: absolute;
  inset: 0;
  top: 41px;
  background: var(--surface);
  padding: 14px 16px;
  display: none;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.skeleton-overlay.active { display: flex; }
.skeleton-line {
  height: 18px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--sk1) 25%, var(--sk2) 50%, var(--sk1) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.char-count { padding: 4px 14px 8px; font-size: 11px; color: var(--text-faint); text-align: right; }

.clear-btn {
  position: absolute;
  top: 10px; right: 10px;
  width: 20px; height: 20px;
  border: none;
  background: var(--surface2);
  border-radius: 50%;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-muted);
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
  z-index: 2;
}
.clear-btn.visible { display: flex; }
.clear-btn:hover { background: var(--border); }

#status-bar {
  min-height: 22px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-faint);
  text-align: right;
}

/* ── 词汇面板 ── */
#learning-panel { margin-top: 24px; display: none; }
#learning-panel.visible { display: block; }

.panel-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-section-title::before {
  content: '';
  display: block;
  width: 3px; height: 14px;
  background: var(--accent);
  border-radius: 2px;
}
.panel-hint {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-faint);
  margin-left: 4px;
}

/* 词汇行（点击保存） */
#vocab-word-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

.vocab-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, opacity .15s;
  user-select: none;
}
.vocab-row:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(79,70,229,.12); }
.vocab-row.saved { border-color: #27ae60; cursor: default; }
.vocab-row.saved:hover { border-color: #27ae60; box-shadow: none; }
.vocab-row.saving { opacity: .6; pointer-events: none; }

.vocab-row-left { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 64px; }

.vocab-type {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  color: #fff;
}
.type-名词 { background: #3498db; }
.type-动词 { background: #27ae60; }
.type-形容词 { background: #e67e22; }
.type-敬語 { background: #9b59b6; }
.type-副词 { background: #1abc9c; }
.type-other { background: #95a5a6; }

.vocab-row-word { font-size: 22px; font-weight: 700; line-height: 1.2; }
.vocab-row-reading { font-size: 12px; color: var(--text-muted); }

.vocab-row-body { flex: 1; }
.vocab-row-meaning { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
.vocab-row-usage { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.vocab-row-usage span { color: var(--text-faint); font-style: italic; }

.vocab-row-indicator {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--text-faint);
  transition: all .15s;
  margin-top: 2px;
}
.vocab-row:hover .vocab-row-indicator { border-color: var(--accent); color: var(--accent); }
.vocab-row.saved .vocab-row-indicator { border-color: #27ae60; color: #27ae60; background: #f0faf4; }
.dark .vocab-row.saved .vocab-row-indicator { background: #0d2e1a; }

/* 语法要点 */
#grammar-container { display: flex; flex-direction: column; gap: 10px; }
.grammar-point {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
}
.grammar-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.grammar-explanation { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
.grammar-example { font-size: 13px; color: var(--text-faint); font-style: italic; }

/* ── 词汇本 ── */
#vocab-book-view { display: none; }
#vocab-book-view.visible { display: block; }

.vocab-book-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.vocab-book-header h2 { font-size: 18px; font-weight: 700; }

#vocab-search {
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  width: 220px;
  background: var(--surface);
  color: var(--text);
  transition: border-color .15s;
}
#vocab-search:focus { border-color: var(--accent); }

.vocab-list { display: flex; flex-direction: column; gap: 8px; }

.vocab-list-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.vocab-list-word { font-size: 22px; font-weight: 700; min-width: 80px; }
.vocab-list-reading { font-size: 12px; color: var(--text-muted); }
.vocab-list-info { flex: 1; }
.vocab-list-meaning { font-size: 14px; color: var(--text); margin: 2px 0 4px; }
.vocab-list-example { font-size: 12px; color: var(--text-muted); }
.vocab-list-example-zh { font-size: 11px; color: var(--text-faint); font-style: italic; }
.vocab-list-date { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

.delete-btn {
  padding: 4px 10px;
  border: 1.5px solid #e74c3c;
  border-radius: 6px;
  background: transparent;
  color: #e74c3c;
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.delete-btn:hover { background: #e74c3c; color: #fff; }

.empty-state { text-align: center; color: var(--text-faint); padding: 60px 20px; font-size: 15px; }

/* ── 响应式 ── */
@media (max-width: 640px) {
  .translation-container { grid-template-columns: 1fr; grid-template-rows: 1fr 3px 1fr; }
  .divider { height: 3px; width: 100%; }
  .divider::after { top: 50%; transform: translateY(-50%); }
  #vocab-search { width: 160px; }
}
</style>
</head>
<body>

<nav>
  <div class="mode-btns">
    <button class="mode-btn active" data-mode="zh-ja">中日</button>
    <button class="mode-btn" data-mode="zh-en">中英</button>
  </div>
  <span class="brand" id="brand-text">翻译学习</span>
  <div class="tabs">
    <button class="tab-btn active" data-tab="translator">翻译</button>
    <button class="tab-btn" data-tab="vocab-book">词汇本<span class="badge" id="vocab-badge"></span></button>
  </div>
  <button id="dark-toggle" title="切换夜间模式">🌙</button>
</nav>

<main>

  <!-- 翻译视图 -->
  <div id="translator-view">
    <div class="style-row">
      <span class="style-label">风格：</span>
      <button class="style-btn active" data-style="normal">普通</button>
      <button class="style-btn" data-style="business">商务礼貌</button>
    </div>

    <div class="translation-container">
      <div class="pane" id="pane-zh">
        <div class="pane-header"><span class="lang-dot"></span>中文</div>
        <textarea id="zh-input" placeholder="输入中文，自动翻译成日文…" spellcheck="false"></textarea>
        <button class="clear-btn" id="clear-zh">×</button>
        <div class="char-count" id="zh-count"></div>
      </div>

      <div class="divider"></div>

      <div class="pane" id="pane-ja">
        <div class="pane-header"><span class="lang-dot"></span>日本語</div>
        <div class="skeleton-overlay" id="ja-skeleton">
          <div class="skeleton-line" style="width:85%"></div>
          <div class="skeleton-line" style="width:65%"></div>
          <div class="skeleton-line" style="width:75%"></div>
        </div>
        <textarea id="ja-input" placeholder="输入日文，自动翻译成中文…" spellcheck="false"></textarea>
        <button class="clear-btn" id="clear-ja">×</button>
        <div class="char-count" id="ja-count"></div>
      </div>
    </div>

    <div id="status-bar"></div>

    <!-- 词汇面板 -->
    <div id="learning-panel">
      <div class="panel-section-title">
        词汇
        <span class="panel-hint">点击单词即可保存到词汇本</span>
      </div>
      <div id="vocab-word-list"></div>

      <div class="panel-section-title" id="grammar-title">语法要点</div>
      <div id="grammar-container"></div>
    </div>
  </div>

  <!-- 词汇本视图 -->
  <div id="vocab-book-view">
    <div class="vocab-book-header">
      <h2>我的词汇本</h2>
      <input type="text" id="vocab-search" placeholder="搜索词汇…">
    </div>
    <div class="vocab-list" id="vocab-list"></div>
  </div>

</main>

<script>
(function () {
  'use strict';

  let currentMode = 'zh-ja';   // 'zh-ja' | 'zh-en'
  let currentStyle = 'normal';
  let activeSide = null;
  let debounceTimerZh = null;
  let debounceTimerJa = null;
  let abortController = null;
  let vocabBookData = [];

  const DEBOUNCE = 800;

  const zhInput    = document.getElementById('zh-input');
  const jaInput    = document.getElementById('ja-input');
  const jaSkeleton = document.getElementById('ja-skeleton');
  const learningPanel = document.getElementById('learning-panel');
  const vocabWordList = document.getElementById('vocab-word-list');
  const grammarContainer = document.getElementById('grammar-container');
  const grammarTitle = document.getElementById('grammar-title');
  const statusBar  = document.getElementById('status-bar');
  const vocabBadge = document.getElementById('vocab-badge');
  const clearZhBtn = document.getElementById('clear-zh');
  const clearJaBtn = document.getElementById('clear-ja');
  const zhCount    = document.getElementById('zh-count');
  const jaCount    = document.getElementById('ja-count');

  // ── 夜间模式 ──
  const darkToggle = document.getElementById('dark-toggle');
  const applyDark = (on) => {
    document.documentElement.classList.toggle('dark', on);
    darkToggle.textContent = on ? '☀️' : '🌙';
  };
  applyDark(localStorage.getItem('dark') === '1');
  darkToggle.addEventListener('click', () => {
    const on = !document.documentElement.classList.contains('dark');
    applyDark(on);
    localStorage.setItem('dark', on ? '1' : '0');
  });

  // ── 模式切换（中日 / 中英） ──
  const MODES = {
    'zh-ja': {
      brand: '中日翻译学习',
      leftLabel: '中文', rightLabel: '日本語',
      leftDot: '#e74c3c', rightDot: '#e84393',
      leftPlaceholder: '输入中文，自动翻译成日文…',
      rightPlaceholder: '输入日文，自动翻译成中文…',
      leftDir: 'zh-ja', rightDir: 'ja-zh'
    },
    'zh-en': {
      brand: '中英翻译学习',
      leftLabel: '中文', rightLabel: 'English',
      leftDot: '#e74c3c', rightDot: '#2980b9',
      leftPlaceholder: '输入中文，自动翻译成英文…',
      rightPlaceholder: 'Type English, auto-translate to Chinese…',
      leftDir: 'zh-en', rightDir: 'en-zh'
    }
  };

  function applyMode(mode) {
    const cfg = MODES[mode];
    currentMode = mode;
    document.getElementById('brand-text').textContent = cfg.brand;
    document.querySelector('#pane-zh .pane-header').innerHTML =
      `<span class="lang-dot" style="background:${cfg.leftDot}"></span>${cfg.leftLabel}`;
    document.querySelector('#pane-ja .pane-header').innerHTML =
      `<span class="lang-dot" style="background:${cfg.rightDot}"></span>${cfg.rightLabel}`;
    zhInput.placeholder = cfg.leftPlaceholder;
    jaInput.placeholder = cfg.rightPlaceholder;
    // Clear both panes and panel
    zhInput.value = ''; jaInput.value = '';
    updateCharCount('zh'); updateCharCount('ja');
    updateClearBtn('zh'); updateClearBtn('ja');
    hideLearningPanel();
    cancelRequest();
    activeSide = null;
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.mode === currentMode) return;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyMode(btn.dataset.mode);
    });
  });

  // ── 风格切换 ──
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      if (activeSide === 'zh' && zhInput.value.trim()) triggerTranslation('zh');
    });
  });

  // ── 标签切换 ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      if (tab === 'translator') {
        document.getElementById('translator-view').style.display = '';
        document.getElementById('vocab-book-view').classList.remove('visible');
      } else {
        document.getElementById('translator-view').style.display = 'none';
        document.getElementById('vocab-book-view').classList.add('visible');
        loadVocabBook();
      }
    });
  });

  // ── 输入事件 ──
  zhInput.addEventListener('input', () => {
    activeSide = 'zh';
    updateCharCount('zh'); updateClearBtn('zh');
    clearTimeout(debounceTimerZh);
    if (!zhInput.value.trim()) { clearJaOutput(); return; }
    debounceTimerZh = setTimeout(() => triggerTranslation('zh'), DEBOUNCE);
  });

  jaInput.addEventListener('input', () => {
    activeSide = 'ja';
    updateCharCount('ja'); updateClearBtn('ja');
    clearTimeout(debounceTimerJa);
    if (!jaInput.value.trim()) { clearZhOutput(); return; }
    debounceTimerJa = setTimeout(() => triggerTranslation('ja'), DEBOUNCE);
  });

  // ── 清空按钮 ──
  clearZhBtn.addEventListener('click', () => {
    zhInput.value = ''; activeSide = null;
    clearZhOutput(); clearJaOutput(); hideLearningPanel();
    updateClearBtn('zh'); updateCharCount('zh'); cancelRequest();
  });
  clearJaBtn.addEventListener('click', () => {
    jaInput.value = ''; activeSide = null;
    clearZhOutput(); clearJaOutput(); hideLearningPanel();
    updateClearBtn('ja'); updateCharCount('ja'); cancelRequest();
  });

  function clearJaOutput() {
    jaInput.value = ''; jaSkeleton.classList.remove('active');
    updateCharCount('ja'); updateClearBtn('ja');
  }
  function clearZhOutput() {
    zhInput.value = ''; updateCharCount('zh'); updateClearBtn('zh');
  }
  function updateCharCount(side) {
    const el = side === 'zh' ? zhCount : jaCount;
    const v  = side === 'zh' ? zhInput.value : jaInput.value;
    el.textContent = v.length > 0 ? v.length + ' 字' : '';
  }
  function updateClearBtn(side) {
    const inp = side === 'zh' ? zhInput : jaInput;
    const btn = side === 'zh' ? clearZhBtn : clearJaBtn;
    btn.classList.toggle('visible', inp.value.length > 0);
  }

  // ── 翻译触发 ──
  function triggerTranslation(side) {
    cancelRequest();
    abortController = new AbortController();
    const cfg = MODES[currentMode];
    if (side === 'zh') doTranslate(zhInput.value.trim(), cfg.leftDir, abortController.signal);
    else               doTranslate(jaInput.value.trim(), cfg.rightDir, abortController.signal);
  }
  function cancelRequest() {
    if (abortController) { abortController.abort(); abortController = null; }
    jaSkeleton.classList.remove('active');
  }

  // ── 主翻译流 ──
  async function doTranslate(text, direction, signal) {
    if (!text) return;
    hideLearningPanel();
    setStatus('翻译中…');

    const isForward = direction === 'zh-ja' || direction === 'zh-en';
    if (isForward) {
      jaSkeleton.classList.add('active');
      jaInput.value = ''; updateCharCount('ja'); updateClearBtn('ja');
    } else {
      zhInput.value = ''; updateCharCount('zh'); updateClearBtn('zh');
    }

    let vocabBuf = null; let grammarBuf = null;

    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, direction, style: currentStyle }),
        signal,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus('翻译失败: ' + (err.error || res.status));
        jaSkeleton.classList.remove('active');
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf = '', firstChar = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        sseBuf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = sseBuf.indexOf('\n\n')) !== -1) {
          const chunk = sseBuf.substring(0, nl);
          sseBuf = sseBuf.substring(nl + 2);
          if (!chunk.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(chunk.slice(6)); } catch { continue; }

          if (data.type === 'char') {
            if (isForward && firstChar) { jaSkeleton.classList.remove('active'); firstChar = false; }
            if (isForward) { jaInput.value += data.char; updateCharCount('ja'); updateClearBtn('ja'); }
            else           { zhInput.value += data.char; updateCharCount('zh'); updateClearBtn('zh'); }
          } else if (data.type === 'vocab') {
            vocabBuf = data.data;
          } else if (data.type === 'grammar') {
            grammarBuf = data.data;
          } else if (data.type === 'done') {
            jaSkeleton.classList.remove('active'); setStatus('');
            if (isForward && vocabBuf && vocabBuf.length > 0) {
              showLearningPanel(vocabBuf, grammarBuf || []);
            }
          } else if (data.type === 'error') {
            setStatus('错误: ' + data.message); jaSkeleton.classList.remove('active');
          }
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error(err); setStatus('网络错误'); jaSkeleton.classList.remove('active');
    }
  }

  // ── 词汇面板 ──
  function showLearningPanel(vocab, grammar) {
    learningPanel.classList.add('visible');

    // 词汇行
    vocabWordList.innerHTML = '';
    (vocab || []).forEach(v => {
      const row = document.createElement('div');
      row.className = 'vocab-row';
      row.innerHTML = `
        <div class="vocab-row-left">
          <span class="vocab-type ${getTypeClass(v.type)}">${esc(v.type || '')}</span>
          <div class="vocab-row-word">${esc(v.word)}</div>
          <div class="vocab-row-reading">${esc(v.reading || '')}</div>
        </div>
        <div class="vocab-row-body">
          <div class="vocab-row-meaning">${esc(v.meaning || '')}</div>
          <div class="vocab-row-usage">${esc(v.example || '')}<br><span>${esc(v.example_zh || '')}</span></div>
        </div>
        <div class="vocab-row-indicator">＋</div>
      `;

      row.addEventListener('click', async () => {
        if (row.classList.contains('saved') || row.classList.contains('saving')) return;
        row.classList.add('saving');
        try {
          const res = await fetch('/api/vocab/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(v),
          });
          if (res.ok) {
            row.classList.remove('saving');
            row.classList.add('saved');
            row.querySelector('.vocab-row-indicator').textContent = '✓';
            refreshVocabBadge();
          } else {
            row.classList.remove('saving');
          }
        } catch {
          row.classList.remove('saving');
        }
      });

      vocabWordList.appendChild(row);
    });

    // 语法要点
    grammarContainer.innerHTML = '';
    grammarTitle.style.display = '';
    (grammar || []).forEach(g => {
      const div = document.createElement('div');
      div.className = 'grammar-point';
      div.innerHTML = `
        <div class="grammar-name">${esc(g.point || '')}</div>
        <div class="grammar-explanation">${esc(g.explanation || '')}</div>
        <div class="grammar-example">${esc(g.example || '')}</div>
      `;
      grammarContainer.appendChild(div);
    });
    if (!grammar || grammar.length === 0) grammarTitle.style.display = 'none';
  }

  function hideLearningPanel() {
    learningPanel.classList.remove('visible');
    vocabWordList.innerHTML = '';
    grammarContainer.innerHTML = '';
  }

  function getTypeClass(type) {
    return { '名词': 'type-名词', '动词': 'type-动词', '形容词': 'type-形容词', '敬語': 'type-敬語', '副词': 'type-副词' }[type] || 'type-other';
  }

  // ── 词汇本 ──
  async function loadVocabBook() {
    try {
      const res = await fetch('/api/vocab/list');
      vocabBookData = await res.json();
      renderVocabBook(vocabBookData);
      refreshVocabBadge();
    } catch (e) { console.error(e); }
  }

  function renderVocabBook(data) {
    const list = document.getElementById('vocab-list');
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有保存任何词汇<br>翻译后点击词汇行即可保存</div>';
      return;
    }
    list.innerHTML = data.map(v => `
      <div class="vocab-list-item">
        <div>
          <div class="vocab-list-word">${esc(v.word)}</div>
          <div class="vocab-list-reading">${esc(v.reading || '')}</div>
          <span class="vocab-type ${getTypeClass(v.type)}" style="font-size:11px;padding:1px 7px;margin-top:4px;display:inline-block">${esc(v.type || '')}</span>
        </div>
        <div class="vocab-list-info">
          <div class="vocab-list-meaning">${esc(v.meaning || '')}</div>
          <div class="vocab-list-example">${esc(v.example || '')}</div>
          <div class="vocab-list-example-zh">${esc(v.example_zh || '')}</div>
          <div class="vocab-list-date">${formatDate(v.created_at)}</div>
        </div>
        <button class="delete-btn" data-id="${v.id}">删除</button>
      </div>
    `).join('');

    list.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        btn.textContent = '…'; btn.disabled = true;
        try {
          await fetch('/api/vocab/' + id, { method: 'DELETE' });
          vocabBookData = vocabBookData.filter(v => String(v.id) !== String(id));
          renderVocabBook(vocabBookData);
          refreshVocabBadge();
        } catch { btn.textContent = '失败'; btn.disabled = false; }
      });
    });
  }

  document.getElementById('vocab-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if (!q) { renderVocabBook(vocabBookData); return; }
    renderVocabBook(vocabBookData.filter(v =>
      (v.word||'').toLowerCase().includes(q) ||
      (v.reading||'').toLowerCase().includes(q) ||
      (v.meaning||'').toLowerCase().includes(q) ||
      (v.example||'').toLowerCase().includes(q)
    ));
  });

  async function refreshVocabBadge() {
    try {
      const res = await fetch('/api/vocab/list');
      const data = await res.json();
      vocabBookData = data;
      vocabBadge.textContent = data.length > 0 ? data.length : '';
    } catch {}
  }

  function setStatus(msg) { statusBar.textContent = msg; }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(dt) {
    if (!dt) return '';
    const d = new Date(dt.replace(' ','T') + 'Z');
    return d.toLocaleDateString('zh-CN', { year:'numeric', month:'short', day:'numeric' });
  }

  refreshVocabBadge();
})();
</script>
</body>
</html>
