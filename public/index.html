<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译学习工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface2: #f5f2ee;
  --border: rgba(0,0,0,0.07);
  --border2: #f0ede8;
  --text: #111111;
  --text-muted: #666666;
  --text-faint: #c0bbb5;
  --topbar-bg: rgba(255,255,255,0.80);
  --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.07), 0 16px 48px rgba(0,0,0,0.04);
  --grad-start: #ff8c42;
  --grad-end: #9b59f6;
  --sk1: #f0ede8;
  --sk2: #e4e0da;
}
.dark {
  --bg: #0f0f0e;
  --surface: #1c1b19;
  --surface2: #252420;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.06);
  --text: #e8e5e0;
  --text-muted: #a09890;
  --text-faint: #504840;
  --topbar-bg: rgba(15,15,14,0.85);
  --card-shadow: 0 1px 3px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.4);
  --sk1: #252420;
  --sk2: #2e2c28;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
               "Helvetica Neue", "Noto Sans SC", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}

/* ── Topbar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  background: var(--topbar-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  height: 56px;
  flex-shrink: 0;
}
.topbar-left  { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.mode-switcher {
  display: flex;
  background: rgba(0,0,0,0.06);
  border-radius: 22px;
  padding: 3px;
  gap: 2px;
}
.dark .mode-switcher { background: rgba(255,255,255,0.08); }
.mode-btn {
  font-size: 14px;
  font-weight: 600;
  padding: 5px 16px;
  border-radius: 18px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text-muted);
  font-family: inherit;
  transition: all 0.2s;
}
.mode-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0,0,0,0.13);
}

.tabs { display: flex; gap: 2px; }
.tab-btn {
  padding: 5px 14px;
  border: none;
  background: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  font-family: inherit;
  transition: all 0.15s;
}
.tab-btn.active { background: rgba(0,0,0,0.06); color: var(--text); }
.dark .tab-btn.active { background: rgba(255,255,255,0.08); }

.badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  border-radius: 10px;
  padding: 1px 6px;
  margin-left: 4px;
  vertical-align: middle;
  min-width: 18px;
  text-align: center;
}
.badge:empty { display: none; }

.style-pill {
  display: flex;
  background: rgba(0,0,0,0.06);
  border-radius: 22px;
  padding: 3px;
}
.dark .style-pill { background: rgba(255,255,255,0.08); }
.style-opt {
  font-size: 13px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 18px;
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.style-opt.active {
  background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
  color: #fff;
}

#dark-toggle {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(0,0,0,0.06);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: background 0.15s;
}
.dark #dark-toggle { background: rgba(255,255,255,0.08); }

/* ── Main layout ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px 24px 0;
  gap: 14px;
  min-height: 0;
}

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  height: 44vh;
  min-height: 280px;
}

.panel {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px 11px;
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
  gap: 10px;
}
.lang-label {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.panel-target .lang-label {
  background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.char-count {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-faint);
  margin-left: auto;
}
.copy-btn {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-faint);
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 8px;
  border-radius: 8px;
  font-family: inherit;
  transition: color 0.15s, background 0.15s;
  margin-left: auto;
}
.copy-btn:hover { background: var(--surface2); color: var(--text-muted); }

.clear-btn {
  width: 22px;
  height: 22px;
  border: none;
  background: rgba(0,0,0,0.05);
  border-radius: 50%;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
  display: none;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
  line-height: 1;
}
.dark .clear-btn { background: rgba(255,255,255,0.07); }
.clear-btn.visible { display: flex; }
.clear-btn:hover { background: rgba(0,0,0,0.10); }

.panel textarea {
  flex: 1;
  padding: 18px 20px;
  font-size: 19px;
  line-height: 1.75;
  color: var(--text);
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font-family: inherit;
  min-height: 0;
}
.panel textarea::placeholder { color: var(--text-faint); font-size: 16px; }

/* Skeleton */
.skeleton-overlay {
  position: absolute;
  inset: 0;
  top: 52px;
  background: var(--surface);
  padding: 18px 20px;
  display: none;
  flex-direction: column;
  gap: 16px;
  pointer-events: none;
  z-index: 1;
}
.skeleton-overlay.active { display: flex; }
.skeleton-line {
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--sk1) 25%, var(--sk2) 50%, var(--sk1) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Status bar */
#status-bar {
  min-height: 18px;
  font-size: 12px;
  color: var(--text-faint);
  text-align: right;
  padding: 0 4px;
}

/* ── Learning panel ── */
#learning-panel {
  display: none;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 24px;
}
#learning-panel.visible { display: block; }

.lp-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 22px 11px;
  border-bottom: 1px solid var(--border2);
}
.lp-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.lp-hint {
  font-size: 12px;
  color: var(--text-faint);
}
.lp-tabs {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.lp-tab {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: rgba(0,0,0,0.05);
  color: var(--text-muted);
  font-family: inherit;
  transition: all 0.15s;
}
.dark .lp-tab { background: rgba(255,255,255,0.06); }
.lp-tab.active {
  background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
  color: #fff;
}

/* Vocab rows */
.vocab-row {
  display: grid;
  grid-template-columns: 150px 120px 90px 1fr 36px;
  align-items: center;
  padding: 13px 22px;
  border-bottom: 1px solid var(--border2);
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}
.vocab-row:last-child { border-bottom: none; }
.vocab-row:hover { background: var(--surface2); }
.vocab-row.saved { cursor: default; }
.vocab-row.saved:hover { background: transparent; }
.vocab-row.saving { opacity: 0.5; pointer-events: none; }

.vocab-word {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.vocab-reading {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 500;
}
.type-pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}
.type-名词    { background: rgba(155,89,246,0.10); color: #9b59f6; }
.type-动词    { background: rgba(52,199,89,0.10);  color: #27ae60; }
.type-形容词  { background: rgba(255,140,66,0.10); color: #e8720c; }
.type-形容动词{ background: rgba(52,199,89,0.10);  color: #27ae60; }
.type-副词    { background: rgba(26,188,156,0.10); color: #1abc9c; }
.type-敬語    { background: rgba(155,89,246,0.10); color: #9b59f6; }
.type-other   { background: rgba(0,0,0,0.05);      color: var(--text-muted); }
.dark .type-other { background: rgba(255,255,255,0.07); }

.vocab-meaning {
  font-size: 15px;
  color: var(--text-muted);
  padding-left: 14px;
}

.save-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0,0,0,0.04);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-faint);
  transition: all 0.15s;
  flex-shrink: 0;
  justify-self: end;
  font-family: inherit;
}
.dark .save-btn { background: rgba(255,255,255,0.05); }
.save-btn:hover { background: rgba(255,140,66,0.12); color: var(--grad-start); }
.vocab-row.saved .save-btn { background: rgba(155,89,246,0.10); color: var(--grad-end); }

/* Grammar cards */
.grammar-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 22px 18px;
}
.grammar-item {
  background: var(--surface2);
  border-radius: 14px;
  padding: 14px 16px;
}
.grammar-point-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 5px;
}
.grammar-explanation {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.65;
  margin-bottom: 4px;
}
.grammar-example {
  font-size: 13px;
  color: var(--text-faint);
  font-style: italic;
  line-height: 1.65;
}

/* ── Vocab book ── */
#vocab-book-view { display: none; padding: 0 0 48px; }
#vocab-book-view.visible { display: block; }

.vocab-book-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 20px 0 0;
}
.vocab-book-header h2 { font-size: 22px; font-weight: 800; }

#vocab-search {
  padding: 9px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  width: 220px;
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  transition: border-color 0.15s;
}
#vocab-search:focus { border-color: var(--grad-end); }

.vocab-list { display: flex; flex-direction: column; gap: 10px; }

.vocab-list-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  display: grid;
  grid-template-columns: 130px 1fr auto;
  align-items: start;
  gap: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.vocab-list-word    { font-size: 22px; font-weight: 700; }
.vocab-list-reading { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
.vocab-list-type    { margin-top: 6px; }
.vocab-list-info    { padding-top: 3px; }
.vocab-list-meaning { font-size: 15px; color: var(--text); font-weight: 500; margin-bottom: 5px; }
.vocab-list-example { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.vocab-list-example-zh { font-size: 12px; color: var(--text-faint); font-style: italic; }
.vocab-list-date    { font-size: 11px; color: var(--text-faint); margin-top: 6px; }

.delete-btn {
  padding: 5px 12px;
  border: 1.5px solid rgba(231,76,60,0.4);
  border-radius: 8px;
  background: transparent;
  color: #e74c3c;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.delete-btn:hover { background: #e74c3c; color: #fff; border-color: #e74c3c; }

.empty-state {
  text-align: center;
  color: var(--text-faint);
  padding: 80px 20px;
  font-size: 16px;
  line-height: 1.8;
}
</style>
</head>
<body>

<!-- ── Topbar ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="zh-ja">中日</button>
      <button class="mode-btn" data-mode="zh-en">中英</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="translator">翻译</button>
      <button class="tab-btn" data-tab="vocab-book">词汇本<span class="badge" id="vocab-badge"></span></button>
    </div>
  </div>
  <div class="topbar-right">
    <div class="style-pill">
      <button class="style-opt active" data-style="normal">普通</button>
      <button class="style-opt" data-style="business">商务</button>
    </div>
    <button id="dark-toggle" title="切换夜间模式">🌙</button>
  </div>
</div>

<!-- ── Translator view ── -->
<div class="main" id="translator-view">
  <div class="panels">
    <!-- Source panel -->
    <div class="panel panel-source">
      <div class="panel-header">
        <span class="lang-label" id="label-left">中文</span>
        <span class="char-count" id="zh-count"></span>
        <button class="clear-btn" id="clear-zh">×</button>
      </div>
      <textarea id="zh-input" placeholder="输入中文，自动翻译…" spellcheck="false"></textarea>
    </div>
    <!-- Target panel -->
    <div class="panel panel-target">
      <div class="panel-header">
        <span class="lang-label" id="label-right">日本語</span>
        <button class="copy-btn" id="copy-btn">复制</button>
        <button class="clear-btn" id="clear-ja">×</button>
      </div>
      <div class="skeleton-overlay" id="ja-skeleton">
        <div class="skeleton-line" style="width:80%"></div>
        <div class="skeleton-line" style="width:58%"></div>
        <div class="skeleton-line" style="width:70%"></div>
      </div>
      <textarea id="ja-input" placeholder="输入日文，自动翻译成中文…" spellcheck="false"></textarea>
    </div>
  </div>

  <div id="status-bar"></div>

  <!-- Learning panel -->
  <div id="learning-panel">
    <div class="lp-header">
      <span class="lp-title">学习面板</span>
      <span class="lp-hint">点击单词保存</span>
      <div class="lp-tabs">
        <button class="lp-tab active" data-section="vocab">词汇</button>
        <button class="lp-tab" data-section="grammar">语法</button>
      </div>
    </div>
    <div id="vocab-section">
      <div id="vocab-word-list"></div>
    </div>
    <div id="grammar-section" style="display:none">
      <div class="grammar-list" id="grammar-container"></div>
    </div>
  </div>
</div>

<!-- ── Vocab book view ── -->
<div class="main" id="vocab-book-view">
  <div class="vocab-book-header">
    <h2>我的词汇本</h2>
    <input type="text" id="vocab-search" placeholder="搜索词汇…">
  </div>
  <div class="vocab-list" id="vocab-list"></div>
</div>

<script>
(function () {
  'use strict';

  let currentMode  = 'zh-ja';
  let currentStyle = 'normal';
  let activeSide   = null;
  let debounceTimerZh = null;
  let debounceTimerJa = null;
  let abortController = null;
  let vocabBookData   = [];

  const DEBOUNCE = 800;

  const zhInput          = document.getElementById('zh-input');
  const jaInput          = document.getElementById('ja-input');
  const jaSkeleton       = document.getElementById('ja-skeleton');
  const learningPanel    = document.getElementById('learning-panel');
  const vocabWordList    = document.getElementById('vocab-word-list');
  const grammarContainer = document.getElementById('grammar-container');
  const statusBar        = document.getElementById('status-bar');
  const vocabBadge       = document.getElementById('vocab-badge');
  const clearZhBtn       = document.getElementById('clear-zh');
  const clearJaBtn       = document.getElementById('clear-ja');
  const zhCount          = document.getElementById('zh-count');
  const labelLeft        = document.getElementById('label-left');
  const labelRight       = document.getElementById('label-right');

  // ── Dark mode ──
  const darkToggle = document.getElementById('dark-toggle');
  const applyDark = (on) => {
    document.documentElement.classList.toggle('dark', on);
    darkToggle.textContent = on ? '☀️' : '🌙';
  };
  applyDark(localStorage.getItem('dark') === '1');
  darkToggle.addEventListener('click', () => {
    const on = !document.documentElement.classList.contains('dark');
    applyDark(on);
    localStorage.setItem('dark', on ? '1' : '0');
  });

  // ── Mode config ──
  const MODES = {
    'zh-ja': {
      leftLabel: '中文', rightLabel: '日本語',
      leftPlaceholder: '输入中文，自动翻译成日文…',
      rightPlaceholder: '输入日文，自动翻译成中文…',
      leftDir: 'zh-ja', rightDir: 'ja-zh'
    },
    'zh-en': {
      leftLabel: '中文', rightLabel: 'English',
      leftPlaceholder: '输入中文，自动翻译成英文…',
      rightPlaceholder: 'Type English, auto-translate to Chinese…',
      leftDir: 'zh-en', rightDir: 'en-zh'
    }
  };

  function applyMode(mode) {
    const cfg = MODES[mode];
    currentMode = mode;
    labelLeft.textContent  = cfg.leftLabel;
    labelRight.textContent = cfg.rightLabel;
    zhInput.placeholder = cfg.leftPlaceholder;
    jaInput.placeholder = cfg.rightPlaceholder;
    zhInput.value = ''; jaInput.value = '';
    updateCharCount('zh'); updateClearBtn('zh'); updateClearBtn('ja');
    hideLearningPanel();
    cancelRequest();
    activeSide = null;
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.mode === currentMode) return;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyMode(btn.dataset.mode);
    });
  });

  // ── Style toggle ──
  document.querySelectorAll('.style-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      if (activeSide === 'zh' && zhInput.value.trim()) triggerTranslation('zh');
    });
  });

  // ── Tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('translator-view').style.display = tab === 'translator' ? '' : 'none';
      const vbv = document.getElementById('vocab-book-view');
      if (tab === 'vocab-book') { vbv.classList.add('visible'); loadVocabBook(); }
      else { vbv.classList.remove('visible'); }
    });
  });

  // ── Learning panel tabs ──
  document.querySelectorAll('.lp-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.lp-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const section = tab.dataset.section;
      document.getElementById('vocab-section').style.display   = section === 'vocab'   ? '' : 'none';
      document.getElementById('grammar-section').style.display = section === 'grammar' ? '' : 'none';
    });
  });

  // ── Copy button ──
  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = jaInput.value.trim();
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = '复制'; }, 1500);
    });
  });

  // ── Input events ──
  zhInput.addEventListener('input', () => {
    activeSide = 'zh';
    clearTimeout(debounceTimerZh);
    clearTimeout(debounceTimerJa);
    cancelRequest();
    updateCharCount('zh'); updateClearBtn('zh');
    if (!zhInput.value.trim()) { clearJaOutput(); return; }
    debounceTimerZh = setTimeout(() => triggerTranslation('zh'), DEBOUNCE);
  });

  jaInput.addEventListener('input', () => {
    activeSide = 'ja';
    clearTimeout(debounceTimerJa);
    clearTimeout(debounceTimerZh);
    cancelRequest();
    updateClearBtn('ja');
    if (!jaInput.value.trim()) { clearZhOutput(); return; }
    debounceTimerJa = setTimeout(() => triggerTranslation('ja'), DEBOUNCE);
  });

  // ── Clear buttons ──
  clearZhBtn.addEventListener('click', () => {
    zhInput.value = ''; activeSide = null;
    clearJaOutput(); hideLearningPanel();
    updateClearBtn('zh'); updateCharCount('zh'); cancelRequest();
  });
  clearJaBtn.addEventListener('click', () => {
    jaInput.value = ''; activeSide = null;
    clearZhOutput(); hideLearningPanel();
    updateClearBtn('ja'); cancelRequest();
  });

  function clearJaOutput() {
    jaInput.value = ''; jaSkeleton.classList.remove('active');
    updateClearBtn('ja');
  }
  function clearZhOutput() {
    zhInput.value = ''; updateCharCount('zh'); updateClearBtn('zh');
  }
  function updateCharCount(side) {
    if (side === 'zh') {
      zhCount.textContent = zhInput.value.length > 0 ? zhInput.value.length + ' 字' : '';
    }
  }
  function updateClearBtn(side) {
    const inp = side === 'zh' ? zhInput : jaInput;
    const btn = side === 'zh' ? clearZhBtn : clearJaBtn;
    btn.classList.toggle('visible', inp.value.length > 0);
  }

  // ── Translation trigger ──
  function triggerTranslation(side) {
    cancelRequest();
    abortController = new AbortController();
    const cfg = MODES[currentMode];
    const dir = side === 'zh' ? cfg.leftDir : cfg.rightDir;
    const txt = side === 'zh' ? zhInput.value.trim() : jaInput.value.trim();
    doTranslate(txt, dir, abortController.signal);
  }
  function cancelRequest() {
    if (abortController) { abortController.abort(); abortController = null; }
    jaSkeleton.classList.remove('active');
  }

  // ── Main translation stream ──
  async function doTranslate(text, direction, signal) {
    if (!text) return;
    hideLearningPanel();
    setStatus('翻译中…');

    const isForward = direction === 'zh-ja' || direction === 'zh-en';
    if (isForward) {
      jaSkeleton.classList.add('active');
      jaInput.value = ''; updateClearBtn('ja');
    } else {
      zhInput.value = ''; updateCharCount('zh'); updateClearBtn('zh');
    }

    let vocabBuf = null, grammarBuf = null;

    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, direction, style: currentStyle }),
        signal,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus('翻译失败: ' + (err.error || res.status));
        jaSkeleton.classList.remove('active');
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf = '', firstChar = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        sseBuf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = sseBuf.indexOf('\n\n')) !== -1) {
          const chunk = sseBuf.substring(0, nl);
          sseBuf = sseBuf.substring(nl + 2);
          if (!chunk.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(chunk.slice(6)); } catch { continue; }

          if (data.type === 'char') {
            if (isForward && firstChar) { jaSkeleton.classList.remove('active'); firstChar = false; }
            if (isForward) { jaInput.value += data.char; updateClearBtn('ja'); }
            else           { zhInput.value += data.char; updateCharCount('zh'); updateClearBtn('zh'); }
          } else if (data.type === 'vocab') {
            vocabBuf = data.data;
          } else if (data.type === 'grammar') {
            grammarBuf = data.data;
          } else if (data.type === 'done') {
            jaSkeleton.classList.remove('active');
            setStatus('');
            if (isForward && vocabBuf && vocabBuf.length > 0) {
              showLearningPanel(vocabBuf, grammarBuf || []);
            }
          } else if (data.type === 'error') {
            setStatus('错误: ' + data.message);
            jaSkeleton.classList.remove('active');
          }
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error(err); setStatus('网络错误'); jaSkeleton.classList.remove('active');
    }
  }

  // ── Learning panel ──
  function showLearningPanel(vocab, grammar) {
    // Reset to vocab tab
    document.querySelectorAll('.lp-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.section === 'vocab');
    });
    document.getElementById('vocab-section').style.display   = '';
    document.getElementById('grammar-section').style.display = 'none';

    // Build vocab rows
    vocabWordList.innerHTML = '';
    (vocab || []).forEach(v => {
      const row = document.createElement('div');
      row.className = 'vocab-row';
      row.innerHTML = `
        <span class="vocab-word">${esc(v.word)}</span>
        <span class="vocab-reading">${esc(v.reading || '')}</span>
        <span class="type-pill ${getTypeClass(v.type)}">${esc(v.type || '')}</span>
        <span class="vocab-meaning">${esc(v.meaning || '')}</span>
        <button class="save-btn" title="保存到词汇本">＋</button>
      `;
      const saveBtn = row.querySelector('.save-btn');
      row.addEventListener('click', async () => {
        if (row.classList.contains('saved') || row.classList.contains('saving')) return;
        row.classList.add('saving');
        try {
          const res = await fetch('/api/vocab/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(v),
          });
          row.classList.remove('saving');
          if (res.ok) {
            row.classList.add('saved');
            saveBtn.textContent = '✓';
            refreshVocabBadge();
          }
        } catch {
          row.classList.remove('saving');
        }
      });
      vocabWordList.appendChild(row);
    });

    // Build grammar items
    grammarContainer.innerHTML = '';
    (grammar || []).forEach(g => {
      const div = document.createElement('div');
      div.className = 'grammar-item';
      div.innerHTML = `
        <div class="grammar-point-name">${esc(g.point || '')}</div>
        <div class="grammar-explanation">${esc(g.explanation || '')}</div>
        <div class="grammar-example">${esc(g.example || '')}</div>
      `;
      grammarContainer.appendChild(div);
    });

    // Show grammar tab only if there's grammar data
    const grammarTab = document.querySelector('.lp-tab[data-section="grammar"]');
    grammarTab.style.display = grammar && grammar.length > 0 ? '' : 'none';

    learningPanel.classList.add('visible');
  }

  function hideLearningPanel() {
    learningPanel.classList.remove('visible');
    vocabWordList.innerHTML = '';
    grammarContainer.innerHTML = '';
  }

  function getTypeClass(type) {
    const map = {
      '名词':'type-名词', '动词':'type-动词', '形容词':'type-形容词',
      '形容动词':'type-形容动词', '副词':'type-副词', '敬語':'type-敬語'
    };
    return map[type] || 'type-other';
  }

  // ── Vocab book ──
  async function loadVocabBook() {
    try {
      const res = await fetch('/api/vocab/list');
      vocabBookData = await res.json();
      renderVocabBook(vocabBookData);
      refreshVocabBadge();
    } catch (e) { console.error(e); }
  }

  function renderVocabBook(data) {
    const list = document.getElementById('vocab-list');
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有保存任何词汇<br>翻译后点击词汇行即可保存</div>';
      return;
    }
    list.innerHTML = data.map(v => `
      <div class="vocab-list-item">
        <div>
          <div class="vocab-list-word">${esc(v.word)}</div>
          <div class="vocab-list-reading">${esc(v.reading || '')}</div>
          <div class="vocab-list-type">
            <span class="type-pill ${getTypeClass(v.type)}">${esc(v.type || '')}</span>
          </div>
        </div>
        <div class="vocab-list-info">
          <div class="vocab-list-meaning">${esc(v.meaning || '')}</div>
          <div class="vocab-list-example">${esc(v.example || '')}</div>
          <div class="vocab-list-example-zh">${esc(v.example_zh || '')}</div>
          <div class="vocab-list-date">${formatDate(v.created_at)}</div>
        </div>
        <button class="delete-btn" data-id="${v.id}">删除</button>
      </div>
    `).join('');

    list.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        btn.textContent = '…'; btn.disabled = true;
        try {
          await fetch('/api/vocab/' + id, { method: 'DELETE' });
          vocabBookData = vocabBookData.filter(v => String(v.id) !== String(id));
          renderVocabBook(vocabBookData);
          refreshVocabBadge();
        } catch { btn.textContent = '失败'; btn.disabled = false; }
      });
    });
  }

  document.getElementById('vocab-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if (!q) { renderVocabBook(vocabBookData); return; }
    renderVocabBook(vocabBookData.filter(v =>
      (v.word||'').toLowerCase().includes(q) ||
      (v.reading||'').toLowerCase().includes(q) ||
      (v.meaning||'').toLowerCase().includes(q) ||
      (v.example||'').toLowerCase().includes(q)
    ));
  });

  async function refreshVocabBadge() {
    try {
      const res = await fetch('/api/vocab/list');
      const data = await res.json();
      vocabBookData = data;
      vocabBadge.textContent = data.length > 0 ? data.length : '';
    } catch {}
  }

  function setStatus(msg) { statusBar.textContent = msg; }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(dt) {
    if (!dt) return '';
    const d = new Date(dt.replace(' ','T') + 'Z');
    return d.toLocaleDateString('zh-CN', { year:'numeric', month:'short', day:'numeric' });
  }

  refreshVocabBadge();
})();
</script>
</body>
</html>
